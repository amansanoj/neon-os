name: Validate firmware
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEON_TOOLS_DIR: ${{ runner.temp }}/neon-tools
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python3 -m pip install -r tools/requirements.txt
          bash tools/setup-native.sh
      - name: Native control, persistence, release and OTA fault tests
        run: |
          python3 tests/run_native.py
          python3 tests/run_security.py \
            --mbedtls-include "$NEON_TOOLS_DIR/native-mbedtls/mbedtls-3.6.6/include" \
            --mbedtls-lib-dir "$NEON_TOOLS_DIR/native-mbedtls/mbedtls-3.6.6/library"
      - name: Install pinned ESP32 toolchain
        run: bash tools/setup.sh
      - name: Compile an OTA-enabled test profile
        run: |
          python3 tools/release.py keygen --private-key "$RUNNER_TEMP/test-signing.pem" --public-key "$RUNNER_TEMP/test-public.pem"
          python3 tools/release.py configure --public-key "$RUNNER_TEMP/test-public.pem" --github-repo "$GITHUB_REPOSITORY"
          python3 tools/build.py
      # Deliberately no signing/publishing job or test-image upload. Production
      # approval and signing happen separately from untrusted PR validation.
